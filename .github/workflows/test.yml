name: Test chess

# Unit tests, lesson validation, the brand sweep and the browser flows for
# apps/chess. Runs on its own for branches and pull requests, and is called by
# deploy.yml and android-apks.yml so nothing ships from main while it is red.
on:
  push:
    branches-ignore: [main]
    paths:
      - "apps/chess/**"
      - "packages/shared/**"
      - "tools/brand-sweep/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apps/chess/**"
      - "packages/shared/**"
      - "tools/brand-sweep/**"
      - ".github/workflows/test.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/chess/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lesson data
        run: npm run test:lessons
      - name: Brand sweep
        working-directory: .
        run: python3 tools/brand-sweep/check.py apps/chess --config apps/chess/brand.json

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/chess/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser flows (production build, real Stockfish)
        run: npx playwright test
        env:
          CI: "1"
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/chess/playwright-report
            apps/chess/test-results
          retention-days: 7
