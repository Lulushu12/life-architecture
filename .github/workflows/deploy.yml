name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # life-architecture is served at the site root; the rest at /<name>/
  SUB_APPS: whist breathe focus games calories ortho

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/*/package-lock.json

      - name: Build all apps
        run: |
          for app in life-architecture $SUB_APPS; do
            echo "::group::build $app"
            (cd "apps/$app" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - name: Compose site
        run: |
          mkdir -p site
          cp -r apps/life-architecture/dist/. site/
          for app in $SUB_APPS; do
            mkdir -p "site/$app"
            cp -r "apps/$app/dist/." "site/$app/"
          done

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
