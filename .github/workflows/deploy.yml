name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/life-architecture/package-lock.json
            apps/whist/package-lock.json

      - name: Build Life Architecture
        working-directory: apps/life-architecture
        run: |
          npm ci
          npm run build

      - name: Build Whist & Rentz
        working-directory: apps/whist
        run: |
          npm ci
          npm run build

      - name: Compose site
        run: |
          mkdir -p site/whist
          cp -r apps/life-architecture/dist/. site/
          cp -r apps/whist/dist/. site/whist/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
