<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/life-architecture/whist/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Whist & Rentz scorekeeper — offline, auto-saving" />
    <link rel="manifest" href="/life-architecture/whist/manifest.json" />
    <title>Whist &amp; Rentz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/life-architecture/whist/sw.js')
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
