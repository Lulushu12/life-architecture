<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food</title>
    <meta http-equiv="refresh" content="0; url=/food/" />
    <link rel="canonical" href="/food/" />
    <style>
      body { background: #0b1220; color: #e6ecf7; font: 16px system-ui, sans-serif; padding: 32px 16px; }
      a { color: #84cc16; }
    </style>
  </head>
  <body>
    <p>Calories is now <a href="/food/">Food</a>. Your data comes with it.</p>
    <script>
      // Drop the old Calories service worker so this scope stops serving the cached app.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const r of regs) if (new URL(r.scope).pathname.endsWith("/calories/")) r.unregister();
        });
      }
      location.replace("/food/" + location.search);
    </script>
  </body>
</html>
